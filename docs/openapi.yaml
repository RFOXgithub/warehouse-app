  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - INVALID_CREDENTIALS
                - FORBIDDEN
                - DOCUMENT_NOT_FOUND
                - ITEM_NOT_FOUND
                - SKU_ALREADY_EXISTS
                - PRODUCT_ALREADY_IN_DOCUMENT
                - INVALID_DOCUMENT_STATUS
                - IDEMPOTENCY_KEY_CONFLICT
                - PRODUCT_NOT_FOUND
                - DOCUMENT_HAS_NO_ITEMS
                - ITEM_NOT_IN_DOCUMENT
                - QUANTITY_EXCEEDS_REMAINING
                - DOCUMENT_NOT_FULLY_RECEIVED
                - INTERNAL_ERROR
            message: { type: string }
            details:
              type: array
              description: |
                Bentuk isi tergantung `code`:
                - `VALIDATION_ERROR` → `FieldErrorDetail`
                - `QUANTITY_EXCEEDS_REMAINING`, `ITEM_NOT_IN_DOCUMENT` → `LineErrorDetail`
                - `DOCUMENT_NOT_FULLY_RECEIVED` → `ItemShortageDetail`
                - kode lain → tidak ada `details`
              items:
                anyOf:
                  - $ref: '#/components/schemas/FieldErrorDetail'
                  - $ref: '#/components/schemas/LineErrorDetail'
                  - $ref: '#/components/schemas/ItemShortageDetail'

    FieldErrorDetail:
      type: object
      description: Satu field yang salah. Untuk array, indeks ditulis dengan titik, contoh `lines.0.quantity`
      required: [field, message]
      additionalProperties: false
      properties:
        field: { type: string, example: lines.0.quantity }
        message: { type: string }

    LineErrorDetail:
      type: object
      description: |
        Satu baris penerimaan yang salah. `line` adalah nomor baris di request (mulai dari 1).
        `sku`, `remaining`, dan `requested` hanya ada untuk `QUANTITY_EXCEEDS_REMAINING`.
      required: [line, item_id, message]
      additionalProperties: false
      properties:
        line: { type: integer, minimum: 1 }
        item_id: { type: integer }
        sku: { type: string }
        remaining: { type: integer, minimum: 0 }
        requested: { type: integer, minimum: 1 }
        message: { type: string }

    ItemShortageDetail:
      type: object
      description: Satu item yang belum diterima penuh saat complete
      required: [item_id, sku, expected_qty, received_qty, remaining_qty, message]
      additionalProperties: false
      properties:
        item_id: { type: integer }
        sku: { type: string }
        expected_qty: { type: integer }
        received_qty: { type: integer }
        remaining_qty: { type: integer, minimum: 1 }
        message: { type: string }

    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, error] }
        database: { type: string, enum: [ok, error] }

    Role:
      type: string
      enum: [OPERATOR, SUPERVISOR]

    User:
      type: object
      required: [id, username, full_name, role]
      properties:
        id: { type: integer }
        username: { type: string }
        full_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    UserRef:
      type: object
      description: Rujukan singkat ke user. Selalu terisi
      required: [id, full_name]
      properties:
        id: { type: integer }
        full_name: { type: string }

    NullableUserRef:
      description: Rujukan ke user yang boleh kosong (`null`), misalnya `submitted_by` sebelum dokumen disubmit
      anyOf:
        - $ref: '#/components/schemas/UserRef'
        - type: 'null'

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 50 }
        password: { type: string, minLength: 1, maxLength: 100 }

    LoginResult:
      type: object
      required: [token, expires_at, user]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }

    Product:
      type: object
      required: [id, sku, name, unit, created_at]
      properties:
        id: { type: integer }
        sku: { type: string, example: FZ-CHK-001 }
        name: { type: string, example: Ayam Fillet }
        unit: { type: string, example: KARTON }
        created_at: { type: string, format: date-time }

    ProductCreate:
      type: object
      required: [sku, name, unit]
      additionalProperties: false
      properties:
        sku:
          type: string
          pattern: '^[A-Za-z0-9-]{3,50}$'
          description: Dipangkas spasinya lalu diubah ke huruf besar sebelum disimpan. Pola berlaku setelah dipangkas
        name: { type: string, minLength: 1, maxLength: 150 }
        unit: { type: string, minLength: 1, maxLength: 20 }

    DocumentStatus:
      type: string
      enum: [DRAFT, OPEN, IN_PROGRESS, COMPLETED, CANCELLED]

    DocumentCreate:
      type: object
      required: [supplier_name, expected_date]
      additionalProperties: false
      properties:
        supplier_name: { type: string, minLength: 1, maxLength: 150 }
        expected_date: { type: string, format: date }
        notes:
          type: [string, 'null']
          maxLength: 500
          description: Teks kosong setelah dipangkas disimpan sebagai `null`

    DocumentSummary:
      type: object
      required: [id, doc_number, supplier_name, expected_date, status, item_count, total_expected, total_received, created_at]
      properties:
        id: { type: integer }
        doc_number: { type: string, example: RCV-20261026-000015 }
        supplier_name: { type: string }
        expected_date: { type: string, format: date }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        item_count: { type: integer }
        total_expected:
          type: integer
          description: Untuk progres (FR-22). Fitur tampilannya berprioritas Sebaiknya, tapi field ini tetap wajib karena query-nya murah
        total_received:
          type: integer
          description: Untuk progres (FR-22), lihat `total_expected`
        created_at: { type: string, format: date-time }

    DocumentDetail:
      type: object
      required: [id, doc_number, supplier_name, expected_date, notes, status, created_by, created_at, submitted_by, submitted_at, completed_by, completed_at, cancelled_by, cancelled_at, cancel_reason, items, receipts]
      properties:
        id: { type: integer }
        doc_number: { type: string }
        supplier_name: { type: string }
        expected_date: { type: string, format: date }
        notes: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        created_by: { $ref: '#/components/schemas/UserRef' }
        created_at: { type: string, format: date-time }
        submitted_by: { $ref: '#/components/schemas/NullableUserRef' }
        submitted_at: { type: [string, 'null'], format: date-time }
        completed_by: { $ref: '#/components/schemas/NullableUserRef' }
        completed_at: { type: [string, 'null'], format: date-time }
        cancelled_by: { $ref: '#/components/schemas/NullableUserRef' }
        cancelled_at: { type: [string, 'null'], format: date-time }
        cancel_reason: { type: [string, 'null'] }
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        receipts:
          type: array
          items: { $ref: '#/components/schemas/Receipt' }

    Item:
      type: object
      required: [id, product_id, sku, product_name, unit, expected_qty, received_qty, remaining_qty]
      properties:
        id: { type: integer }
        product_id: { type: integer }
        sku: { type: string }
        product_name: { type: string }
        unit: { type: string }
        expected_qty: { type: integer }
        received_qty: { type: integer }
        remaining_qty: { type: integer, description: expected_qty − received_qty }

    ItemCreate:
      type: object
      required: [product_id, expected_qty]
      additionalProperties: false
      properties:
        product_id: { type: integer, minimum: 1 }
        expected_qty: { type: integer, minimum: 1, maximum: 1000000 }

    ItemUpdate:
      type: object
      required: [expected_qty]
      additionalProperties: false
      properties:
        expected_qty: { type: integer, minimum: 1, maximum: 1000000 }

    ReceiptCreate:
      type: object
      required: [lines]
      additionalProperties: false
      properties:
        notes:
          type: [string, 'null']
          maxLength: 500
          description: Teks kosong setelah dipangkas disimpan sebagai `null`
        lines:
          type: array
          minItems: 1
          description: '`item_id` tidak boleh muncul dua kali'
          items:
            type: object
            required: [item_id, quantity]
            additionalProperties: false
            properties:
              item_id: { type: integer, minimum: 1 }
              quantity: { type: integer, minimum: 1 }

    Receipt:
      type: object
      required: [id, receipt_number, document_id, notes, received_by, received_at, lines]
      properties:
        id: { type: integer }
        receipt_number: { type: string, example: GR-20261026-000001 }
        document_id: { type: integer }
        notes: { type: [string, 'null'] }
        received_by: { $ref: '#/components/schemas/UserRef' }
        received_at: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [transaction_id, item_id, product_id, sku, product_name, quantity, balance_after]
            properties:
              transaction_id: { type: integer }
              item_id: { type: integer }
              product_id: { type: integer }
              sku: { type: string }
              product_name: { type: string }
              quantity: { type: integer }
              balance_after: { type: integer }

    CancelRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    InventoryBalance:
      type: object
      required: [product_id, sku, name, unit, on_hand_qty, updated_at]
      properties:
        product_id: { type: integer }
        sku: { type: string }
        name: { type: string }
        unit: { type: string }
        on_hand_qty: { type: integer }
        updated_at: { type: string, format: date-time }

    InventoryTransaction:
      type: object
      required: [id, created_at, product_id, sku, product_name, type, quantity, balance_after, receipt_number, doc_number, created_by]
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        product_id: { type: integer }
        sku: { type: string }
        product_name: { type: string }
        type: { type: string, enum: [RECEIPT] }
        quantity: { type: integer }
        balance_after: { type: integer }
        receipt_number: { type: string }
        doc_number: { type: string }
        created_by: { $ref: '#/components/schemas/UserRef' }
